server {
    listen 80;
    server_name 202.155.91.204;

    root /var/www/simpanan;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Cache HTML briefly
    location ~* \.(?:html|htm)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    location /api {
        alias /var/www/api-simpanan/public;
        index index.php;
        try_files $uri $uri/ @api;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
            fastcgi_param SCRIPT_FILENAME /var/www/api-simpanan/public/index.php;
            fastcgi_param REQUEST_URI $request_uri;
        }
    }

    location @api {
        rewrite ^/api/(.*)$ /api/index.php?/$1 last;
    }
}
